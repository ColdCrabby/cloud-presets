components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    HealthBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthBody.json
          format: uri
          readOnly: true
          type: string
        lastIngest:
          description: Time of the last successful ingest, or null until the first ingest.
          format: date-time
          type:
            - string
            - "null"
        ready:
          description: Whether a catalog has been loaded and can be served.
          examples:
            - false
          type: boolean
        revision:
          description: Git commit SHA of the served catalog, or null until the first ingest.
          type:
            - string
            - "null"
        status:
          description: Liveness marker; always "ok" when the process is answering.
          examples:
            - ok
          type: string
      required:
        - status
        - ready
        - revision
        - lastIngest
      type: object
info:
  description: In-memory, searchable catalog of Cold Crabby presets served from ColdCrabby/presets. No database; every served structure is derived from one Git commit.
  title: Cold Crabby Preset Cloud
  version: 0.1.0
openapi: 3.1.0
paths:
  /v1/health:
    get:
      description: Reports liveness plus readiness and the served catalog revision. Readiness is false until the first successful ingest loads a catalog.
      operationId: get-health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Liveness and readiness
      tags:
        - Operations
